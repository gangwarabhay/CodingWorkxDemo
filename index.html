<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css" />
    <title>Demo Of ScoreCard</title>
</head>

<body>
    <h1>Demo Of Git</h1>
    <p>This is a simple demo of cricket Score Card.</p>
    <table id="table" border="1">
        <tr>
            <th>Player</th>
            <th>Score</th>
            <th>Action</th>
        </tr>
        <tr>
            <td>Player 1</td>
            <td class="score">10</td>
            <th><button data-player="0">your chance</button></th>
        </tr>
        <tr>
            <td>Player 2</td>
            <td class="score">15</td>
            <th><button data-player="1">your chance</button></th>
        </tr>
        <tr>
            <td>Player 3</td>
            <td class="score">20</td>
            <th><button data-player="2">your chance</button></th>
        </tr>
        <tr>
            <td>Player 4</td>
            <td class="score">25</td>
            <th><button data-player="3">your chance</button></th>
        </tr>
    </table>
    <script src="index.js"></script>
</body>

</html>
